name: End-to-End Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      TESTING: 'true'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Verify isolated test environment before migrations
        run: |
          npx tsx -e "import { testingAllowed } from './lib/testing'; if (!testingAllowed()) throw new Error('CI requires an explicit test database with a name ending in _test'); if (!process.env.NEXTAUTH_SECRET) throw new Error('NEXTAUTH_SECRET is required')"

      - name: Verify test endpoint protection
        run: npx tsx --test verification/config.test.ts

      - name: Run database migrations
        run: npx drizzle-kit push

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
